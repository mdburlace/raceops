# RaceOps stack for Portainer (Stacks → Add stack → Repository or Upload).
# Set JWT_SECRET and POSTGRES_PASSWORD in the stack's environment variables.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raceops
      POSTGRES_USER: raceops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - raceops_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raceops -d raceops"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: raceops:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://raceops:${POSTGRES_PASSWORD}@db:5432/raceops
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      JWT_TTL: ${JWT_TTL:-60d}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Sign-in protection (see README → Security)
      LOGIN_MAX_PER_ACCOUNT: ${LOGIN_MAX_PER_ACCOUNT:-5}
      LOGIN_MAX_PER_IP: ${LOGIN_MAX_PER_IP:-20}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      # AI assistant (optional): your Anthropic API key — turn AI on under Platform admin → AI assistant
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Only if your key isn't limited to one workspace: that workspace's ID (wrkspc_…)
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      # Track weather: open-meteo (default, free for non-commercial use) or off. Paid Open-Meteo plans: set the key.
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      # Proxies whose X-Forwarded-For is trusted (pfSense HAProxy on a private network is covered)
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      # Email notifications (optional): nothing is sent until SMTP_HOST is set
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # The app's public address, used for links in emails (e.g. https://raceops.yourdomain.com)
      APP_URL: ${APP_URL:-}
      # How often official iCal feeds for shared series/tracks are checked (hours; 0 = off)
      CALENDAR_FEED_HOURS: ${CALENDAR_FEED_HOURS:-12}
    volumes:
      - raceops_uploads:/data/uploads
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  raceops_db:
  raceops_uploads:
